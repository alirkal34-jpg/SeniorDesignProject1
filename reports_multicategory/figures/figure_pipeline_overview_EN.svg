<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1702" height="430" viewBox="0 0 1702 430"><rect width="1702" height="430" fill="#FFFFFF"/><text x="851" y="40" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="26" font-weight="700" fill="#22252A">THE END-TO-END PIPELINE</text><rect x="40" y="92" width="232" height="272" rx="10" fill="#FBE6CC" stroke="#B9770E" stroke-width="1.6"/><circle cx="66" cy="120" r="15" fill="#B9770E"/><text x="66" y="125" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1</text><text x="90" y="125" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#6B4406">COLLECT</text><text x="58" y="158" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#6B4406">Scrapes real listings from</text><text x="58" y="175" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#6B4406">Akakçe, category by category,</text><text x="58" y="192" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#6B4406">resuming across sessions when</text><text x="58" y="209" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#6B4406">rate-limited.</text><text x="58" y="244" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#B9770E">FILES</text><text x="58" y="260" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#6B4406">category_taxonomy.py,</text><text x="58" y="274" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#6B4406">product_scraper.py,</text><text x="58" y="288" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#6B4406">selenium_collector.py</text><text x="58" y="324" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#B9770E">489 products · 10 categories</text><path d="M278,218.0 L312,228.0 L278,238.0 Z" fill="#5A5A55"/><line x1="272" y1="228.0" x2="312" y2="228.0" stroke="#5A5A55" stroke-width="1.8"/><rect x="318" y="92" width="232" height="272" rx="10" fill="#DCE9F7" stroke="#2C5D8F" stroke-width="1.6"/><circle cx="344" cy="120" r="15" fill="#2C5D8F"/><text x="344" y="125" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2</text><text x="368" y="125" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#123A5E">PROCESS &amp; VALIDATE</text><text x="336" y="158" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">Applies a profile-specific</text><text x="336" y="175" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">required-field set per</text><text x="336" y="192" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">category, then flags any row</text><text x="336" y="209" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">that fails the quality gate.</text><text x="336" y="244" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#2C5D8F">FILES</text><text x="336" y="260" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">data_processor.py,</text><text x="336" y="274" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">quality_check.py,</text><text x="336" y="288" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">product_catalog.py</text><text x="336" y="324" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2C5D8F">489 valid · 0 issues</text><path d="M556,218.0 L590,228.0 L556,238.0 Z" fill="#5A5A55"/><line x1="550" y1="228.0" x2="590" y2="228.0" stroke="#5A5A55" stroke-width="1.8"/><rect x="596" y="92" width="232" height="272" rx="10" fill="#DCE9F7" stroke="#2C5D8F" stroke-width="1.6"/><circle cx="622" cy="120" r="15" fill="#2C5D8F"/><text x="622" y="125" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3</text><text x="646" y="125" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#123A5E">GENERATE KEYWORD</text><text x="614" y="158" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">Builds one</text><text x="614" y="175" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">transactional-intent search</text><text x="614" y="192" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">phrase per product from real</text><text x="614" y="209" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">brand, model and variant</text><text x="614" y="226" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">fields.</text><text x="614" y="261" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#2C5D8F">FILES</text><text x="614" y="277" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">keyword_generator.py,</text><text x="614" y="291" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">keyword_loader.py</text><text x="614" y="327" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2C5D8F">489 keywords · deterministic</text><path d="M834,218.0 L868,228.0 L834,238.0 Z" fill="#5A5A55"/><line x1="828" y1="228.0" x2="868" y2="228.0" stroke="#5A5A55" stroke-width="1.8"/><rect x="874" y="92" width="232" height="272" rx="10" fill="#DCE9F7" stroke="#2C5D8F" stroke-width="1.6"/><circle cx="900" cy="120" r="15" fill="#2C5D8F"/><text x="900" y="125" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">4</text><text x="924" y="125" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#123A5E">EVALUATE — 4 METHODS</text><text x="892" y="158" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">Runs all four judging methods</text><text x="892" y="175" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">on the same keyword inside one</text><text x="892" y="192" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">LangGraph graph, each writing</text><text x="892" y="209" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#123A5E">to a shared schema.</text><text x="892" y="244" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#2C5D8F">FILES</text><text x="892" y="260" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">langgraph_flow.py,</text><text x="892" y="274" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">rule_based_evaluator.py,</text><text x="892" y="288" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">nano_llm_evaluator.py,</text><text x="892" y="302" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">tavily_client.py,</text><text x="892" y="316" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#123A5E">agentic_search.py</text><text x="892" y="352" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2C5D8F">80 live runs · 399 results</text><path d="M1112,218.0 L1146,228.0 L1112,238.0 Z" fill="#5A5A55"/><line x1="1106" y1="228.0" x2="1146" y2="228.0" stroke="#5A5A55" stroke-width="1.8"/><rect x="1152" y="92" width="232" height="272" rx="10" fill="#E3F1E4" stroke="#3B7D42" stroke-width="1.6"/><circle cx="1178" cy="120" r="15" fill="#3B7D42"/><text x="1178" y="125" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">5</text><text x="1202" y="125" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#1E4722">LABEL BY HUMAN</text><text x="1170" y="158" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1E4722">Exports unique URLs to Excel</text><text x="1170" y="175" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1E4722">with predictions hidden, then</text><text x="1170" y="192" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1E4722">re-imports the filled workbook</text><text x="1170" y="209" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#1E4722">into ground truth.</text><text x="1170" y="244" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#3B7D42">FILES</text><text x="1170" y="260" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#1E4722">export_label_workbook.py,</text><text x="1170" y="274" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#1E4722">import_label_workbook.py,</text><text x="1170" y="288" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#1E4722">ground_truth.py</text><text x="1170" y="324" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#3B7D42">193 URLs · 100% coverage</text><path d="M1390,218.0 L1424,228.0 L1390,238.0 Z" fill="#5A5A55"/><line x1="1384" y1="228.0" x2="1424" y2="228.0" stroke="#5A5A55" stroke-width="1.8"/><rect x="1430" y="92" width="232" height="272" rx="10" fill="#F2F2F0" stroke="#7A7A72" stroke-width="1.6"/><circle cx="1456" cy="120" r="15" fill="#7A7A72"/><text x="1456" y="125" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">6</text><text x="1480" y="125" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="700" fill="#33332E">MEASURE &amp; REPORT</text><text x="1448" y="158" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#33332E">Freezes which result files a</text><text x="1448" y="175" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#33332E">report is built from, then</text><text x="1448" y="192" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#33332E">computes accuracy, specificity</text><text x="1448" y="209" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" fill="#33332E">and balanced accuracy.</text><text x="1448" y="244" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1" fill="#7A7A72">FILES</text><text x="1448" y="260" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#33332E">build_manifest.py,</text><text x="1448" y="274" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#33332E">metrics.py,</text><text x="1448" y="288" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#33332E">category_metrics.py,</text><text x="1448" y="302" text-anchor="start" font-family="Consolas, Courier New, monospace" font-size="9.5" fill="#33332E">multicategory_report.py</text><text x="1448" y="338" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7A7A72">Accuracy · Specificity · Bal. acc.</text><text x="851" y="406" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-style="italic" fill="#5A5A55">Every number above comes from a file on disk — the pipeline is reproducible end to end, from raw scrape to final report.</text></svg>